[project]
name = "duckdb-adt-airflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airflow-provider-duckdb>=0.2.0",
    "apache-airflow>=3.4.0",
    "apache-airflow-providers-postgres>=7.1.2",
    "astronomer-cosmos>=1.16.0",
    "duckdb>=2.0.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pyodbc>=5.5.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.workspace]
members = [
    "dbt",
]

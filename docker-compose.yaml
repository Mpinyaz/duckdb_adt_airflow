x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
      PYTHON_VERSION: ${PYTHON_VERSION}
  env_file:
    - path: .env
      required: true
    - path: airflow/.env
      required: true
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${_AIRFLOW_WWW_USER_USERNAME}:${_AIRFLOW_WWW_USER_PASSWORD}@postgres/airflow

  volumes:
    # Airflow runtime mounts
    - ${AIRFLOW_PROJ_DIR}/airflow/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR}/airflow/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR}/airflow/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR}/scripts:/opt/airflow/scripts
    # Project application mounts in /app
    - ${AIRFLOW_PROJ_DIR}/data:/app/data
    - ${AIRFLOW_PROJ_DIR}/ingest:/app/ingest
    - ${AIRFLOW_PROJ_DIR}/dbt:/app/dbt
    # Anonymous volume preserves container-built dbt virtualenv
    - /app/dbt/.venv

  user: "${AIRFLOW_UID}:0"
  networks:
    - audit_network
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    base:
      condition: service_completed_successfully

services:
  base:
    container_name: adt-base
    image: adt-base:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    restart: "no"
    networks:
      - audit_network

  postgres:
    image: postgres:16
    env_file:
      - path: airflow/.env # default
        required: true
    environment:
      POSTGRES_USER: ${_AIRFLOW_WWW_USER_USERNAME}
      POSTGRES_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    networks:
      - audit_network

  airflow-apiserver:
    <<: *airflow-common # ← "Copy all config from airflow-common here"
    command: api-server # ← Plus override/add this
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common # ← "Copy all config from airflow-common here"
    command: scheduler # ← Plus override/add this
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    volumes:
      # Re-declare all common volumes here as compose doesn't auto-merge
      - ${AIRFLOW_PROJ_DIR}/airflow/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR}/airflow/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR}/airflow/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR}/airflow/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR}/scripts:/opt/airflow/scripts
      - ${AIRFLOW_PROJ_DIR}/data:/app/data
      - ${AIRFLOW_PROJ_DIR}/ingest:/app/ingest
      - ${AIRFLOW_PROJ_DIR}/dbt:/app/dbt
      - /app/dbt/.venv
      # Docker socket for dbt container exec
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

    working_dir: /app

  airflow-dag-processor:
    <<: *airflow-common # ← "Copy all config from airflow-common here"
    command: dag-processor # ← Plus override/add this
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: /opt/airflow/scripts/airflow-init.sh
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
    networks:
      - audit_network
    user: "0:0"

  duckdb:
    image: duckdb/duckdb
    volumes:
      - ./db:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    network_mode: host # for duckdb web ui

  dbt:
    container_name: dbt
    build:
      context: .
      dockerfile: Dockerfile.dbt
      target: dbt-third-party # name of the build stage from the Dockerfile you want to build and run.
      additional_contexts:
        adt-base:latest: service:base
      args:
        dbt_third_party: "dbt-duckdb" # or whichever plugin you need
    image: my-dbt:latest
    entrypoint: ""
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./dbt:/app/dbt
      - ./.dbt:/root/.dbt
    working_dir: /app
    stdin_open: true
    tty: true
    command: sleep infinity
    network_mode: host # dbt docs UI is served via host network
    depends_on:
      base:
        condition: service_completed_successfully
      duckdb:
        condition: service_started
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    networks:
      - audit_network

networks:
  audit_network:
    name: audit_network
    driver: bridge

volumes:
  postgres-db-volume:
  redis:
    external: false
